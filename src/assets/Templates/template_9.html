<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitation</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .invitation {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .title {
      font-size: 36px;
      font-weight: bold;
      color: #1f2937;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 30px;
    }

    .name {
      font-size: 32px;
      font-weight: 600;
      color: #ef4444;
      margin: 20px 0;
    }

    .details {
      font-size: 16px;
      color: #374151;
      line-height: 1.8;
      margin-top: 20px;
    }

    .highlight {
      font-weight: 600;
      color: #111827;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #6b7280;
    }

    .divider {
      width: 60px;
      height: 4px;
      background: #ef4444;
      margin: 20px auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="invitation">
    <div class="title">You're Invited!</div>
    <div class="subtitle">Join us to celebrate a special day</div>

    <div class="divider"></div>

    <div class="name">Aarav's Birthday Party</div>

    <div class="details">
      <p><span class="highlight">Date:</span> 25th March 2026</p>
      <p><span class="highlight">Time:</span> 6:00 PM onwards</p>
      <p><span class="highlight">Venue:</span> Sunshine Party Hall,<br />Chennai</p>
    </div>

    <div class="footer">
      We look forward to celebrating with you 💖
    </div>
  </div>

</body>
</html>
